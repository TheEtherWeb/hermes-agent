# NEXUS Redis configuration
# Enable keyspace notifications for streams and expired keys
notify-keyspace-events "KEAx"

# Streams: set max memory policy for LRU eviction
maxmemory-policy allkeys-lru

# Persistence: AOF for durability (streams data is critical)
appendonly yes
appendfsync everysec

# Stream max length defaults (prevents unbounded growth)
# Individual streams enforce their own MAXLEN in application code
stream-node-max-bytes 4096
stream-node-max-entries 100

# Allow up to 10000 connected clients
maxclients 10000

# Bind to all interfaces inside Docker network
bind 0.0.0.0
protected-mode no
