version: "3.9"

networks:
  nexus:
    driver: bridge

volumes:
  timescaledb_data:
  mongodb_data:
  redis_data:
  finbert_cache:

services:
  # ── Infrastructure ───────────────────────────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_dev}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./infra/timescaledb/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks: [nexus]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: nexus
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-nexus_dev}
      MONGO_INITDB_DATABASE: nexus
    volumes:
      - mongodb_data:/data/db
      - ./infra/mongodb/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "27017:27017"
    networks: [nexus]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    networks: [nexus]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Data Ingestion ────────────────────────────────────────────────────────────
  ingestion:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    environment:
      POLYGON_API_KEY: ${POLYGON_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
      REDIS_URL: redis://redis:6379
      TIMESCALE_URL: postgresql://nexus:${POSTGRES_PASSWORD:-nexus_dev}@timescaledb:5432/nexus
      MONGODB_URL: mongodb://nexus:${MONGO_PASSWORD:-nexus_dev}@mongodb:27017/nexus?authSource=admin
      WATCHED_SYMBOLS: ${WATCHED_SYMBOLS:-AAPL,MSFT,GOOGL,TSLA,NVDA}
    depends_on:
      timescaledb: {condition: service_healthy}
      mongodb: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [nexus]
    restart: unless-stopped

  # ── Algorithm Engine (Celery workers) ─────────────────────────────────────────
  algo-engine:
    build:
      context: ./services/algorithms
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      TIMESCALE_URL: postgresql://nexus:${POSTGRES_PASSWORD:-nexus_dev}@timescaledb:5432/nexus
      MONGODB_URL: mongodb://nexus:${MONGO_PASSWORD:-nexus_dev}@mongodb:27017/nexus?authSource=admin
      FINBERT_DEVICE: ${FINBERT_DEVICE:-cpu}
      ARIMA_MAX_ORDER: ${ARIMA_MAX_ORDER:-5}
      MONTE_CARLO_PATHS: ${MONTE_CARLO_PATHS:-1000}
      CROSS_VALIDATE_EVERY_N: ${CROSS_VALIDATE_EVERY_N:-10}
      REGIME_CLASSIFY_EVERY_N: ${REGIME_CLASSIFY_EVERY_N:-50}
      META_LEARNING_WINDOW: ${META_LEARNING_WINDOW:-500}
      MAX_ALLOCATION: ${MAX_ALLOCATION:-0.15}
      WATCHED_SYMBOLS: ${WATCHED_SYMBOLS:-AAPL,MSFT,GOOGL,TSLA,NVDA}
    volumes:
      - finbert_cache:/root/.cache/huggingface
    depends_on:
      timescaledb: {condition: service_healthy}
      mongodb: {condition: service_healthy}
      redis: {condition: service_healthy}
    deploy:
      resources:
        reservations:
          memory: 4G
    networks: [nexus]
    restart: unless-stopped

  # Celery beat scheduler (runs alongside algo-engine)
  algo-beat:
    build:
      context: ./services/algorithms
      dockerfile: Dockerfile
    command: celery -A celery_app beat --loglevel=info
    environment:
      REDIS_URL: redis://redis:6379
      TIMESCALE_URL: postgresql://nexus:${POSTGRES_PASSWORD:-nexus_dev}@timescaledb:5432/nexus
      MONGODB_URL: mongodb://nexus:${MONGO_PASSWORD:-nexus_dev}@mongodb:27017/nexus?authSource=admin
    depends_on:
      redis: {condition: service_healthy}
    networks: [nexus]
    restart: unless-stopped

  # Celery monitoring UI
  flower:
    build:
      context: ./services/algorithms
      dockerfile: Dockerfile
    command: celery -A celery_app flower --port=5555
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "5555:5555"
    depends_on:
      redis: {condition: service_healthy}
    networks: [nexus]

  # ── API Gateway ────────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    environment:
      PORT: 3001
      REDIS_URL: redis://redis:6379
      TIMESCALE_URL: postgresql://nexus:${POSTGRES_PASSWORD:-nexus_dev}@timescaledb:5432/nexus
      MONGODB_URL: mongodb://nexus:${MONGO_PASSWORD:-nexus_dev}@mongodb:27017/nexus?authSource=admin
      WATCHED_SYMBOLS: ${WATCHED_SYMBOLS:-AAPL,MSFT,GOOGL,TSLA,NVDA}
    ports:
      - "3001:3001"
    depends_on:
      timescaledb: {condition: service_healthy}
      mongodb: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [nexus]
    restart: unless-stopped

  # ── React Dashboard ────────────────────────────────────────────────────────────
  dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3001}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    networks: [nexus]
    restart: unless-stopped
